services:
  # =========================
  # COALINTEL BACKEND
  # =========================
  - type: web
    name: coalintel-backend
    runtime: docker
    plan: free
    branch: Main_1

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: API_V1_STR
        value: /api/v1

      - key: DATABASE_URL
        fromDatabase:
          name: coalintel-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: LLM_PROVIDER
        value: gemini

      - key: LLM_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false

      - key: STORAGE_PROVIDER
        value: local

      - key: UPLOAD_DIR
        value: /storage/uploads

      - key: CHROMA_DB_DIR
        value: /storage/chroma_db

      - key: REPORT_DIR
        value: /storage/reports

      - key: DOCUMENT_AI_ENABLED
        value: "true"

      # Render supplies the public HTTPS URL of the Document AI web service.
      # This is intentionally public because Free services cannot use the
      # paid private-service tier.
      - key: DOCUMENT_AI_URL
        fromService:
          name: coalintel-document-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: DOCUMENT_AI_DEVICE
        value: cpu

      - key: DOCUMENT_AI_FALLBACK_TO_TESSERACT
        value: "true"

  # =========================
  # ISOLATED DOCUMENT AI
  # =========================
  # This must remain a separate service so PaddleOCR/PaddleX are not merged
  # into the Python 3.14 backend. Free Render has no private-service compute,
  # so this demo deployment exposes the narrow HTTP service publicly.
  - type: web
    name: coalintel-document-ai
    runtime: docker
    plan: free
    branch: Main_1

    dockerfilePath: ./document_ai_service/Dockerfile
    dockerContext: .

    healthCheckPath: /health

    envVars:
      - key: DOCUMENT_AI_HOST
        value: 0.0.0.0

      # The service selects Render's injected PORT. DOCUMENT_AI_PORT is left
      # unset so local execution still defaults to 127.0.0.1:8765/8765.
      - key: DOCUMENT_AI_DEVICE
        value: cpu

      - key: DOCUMENT_AI_CPU_THREADS
        value: "2"

      - key: DOCUMENT_AI_DISABLE_MKLDNN
        value: "true"


  # =========================
  # COALINTEL FRONTEND
  # =========================
  - type: web
    name: coalintel-frontend
    runtime: node
    plan: free
    branch: Main_1

    rootDir: frontend

    buildCommand: npm install && npm run build
    startCommand: next start -p $PORT

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1

      - key: BACKEND_URL
        sync: false


databases:
  # =========================
  # COALINTEL POSTGRESQL
  # =========================
  - name: coalintel-db
    databaseName: coalintel_db
    user: coalintel
    plan: free
