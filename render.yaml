services:
  # =========================
  # COALINTEL BACKEND
  # =========================
  - type: web
    name: coalintel-backend
    runtime: docker
    plan: free
    branch: Main_1

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: API_V1_STR
        value: /api/v1

      - key: DATABASE_URL
        fromDatabase:
          name: coalintel-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: LLM_PROVIDER
        value: gemini

      - key: LLM_API_KEY
        sync: false

      - key: FRONTEND_URL
        fromService:
          type: web
          name: coalintel-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: coalintel-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: STORAGE_PROVIDER
        value: local

      - key: UPLOAD_DIR
        value: /storage/uploads

      - key: CHROMA_DB_DIR
        value: /storage/chroma_db

      - key: REPORT_DIR
        value: /storage/reports


  # =========================
  # COALINTEL FRONTEND
  # =========================
  - type: web
    name: coalintel-frontend
    runtime: node
    plan: free
    branch: Main_1

    rootDir: frontend

    buildCommand: npm install && npm run build
    startCommand: next start -p $PORT

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1

      - key: BACKEND_URL
        fromService:
          type: web
          name: coalintel-backend
          envVarKey: RENDER_EXTERNAL_URL


databases:
  # =========================
  # COALINTEL POSTGRESQL
  # =========================
  - name: coalintel-db
    databaseName: coalintel_db
    user: coalintel
    plan: free